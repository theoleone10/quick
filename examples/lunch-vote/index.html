<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunch Vote</title>
  <script src="/_quick/quick.js"></script>
  <style>
    :root { --bg:#fafaf9; --fg:#1c1917; --mut:#78716c; --card:#fff; --line:#e7e5e4; --acc:#ea580c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0c0a09; --fg:#f5f5f4; --mut:#a8a29e; --card:#1c1917; --line:#292524; --acc:#fb923c; } }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
    main { max-width:560px; margin:0 auto; padding:32px 16px; }
    h1 { margin:0 0 4px; } .mut { color:var(--mut); font-size:14px; }
    form { display:flex; gap:8px; margin:20px 0; }
    input { flex:1; min-width:0; }
    input, button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:inherit; }
    button { cursor:pointer; }
    .primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
    .opt { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; position:relative; overflow:hidden; }
    .bar { position:absolute; inset:0 auto 0 0; background:var(--acc); opacity:.12; transition:width .3s; }
    .opt span { flex:1; position:relative; } .opt b { position:relative; }
    .voted { border-color:var(--acc); }
    #ai { margin-top:24px; white-space:pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>🍜 Where's lunch?</h1>
  <div class="mut"><span id="who">…</span> · <span id="online">…</span></div>

  <form id="add"><input id="name" placeholder="Suggest a place" maxlength="60" required><button class="primary">Add</button></form>
  <div id="opts"></div>
  <button id="suggest">✨ Ask AI for ideas</button>
  <div id="ai" class="mut"></div>
</main>
<script>
  const options = quick.db.collection("options");
  const votes = quick.db.collection("votes");    // one doc per voter, id = voter name
  let me, optList = [], voteList = [];

  function render() {
    const counts = {};
    voteList.forEach(v => counts[v.option] = (counts[v.option] || 0) + 1);
    const total = voteList.length || 1;
    const mine = voteList.find(v => v.id === me?.idKey)?.option;
    const el = document.getElementById("opts");
    el.replaceChildren(...optList
      .slice().sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0))
      .map(o => {
        const row = document.createElement("div");
        row.className = "opt" + (mine === o.id ? " voted" : "");
        const bar = document.createElement("div"); bar.className = "bar";
        bar.style.width = ((counts[o.id] || 0) / total * 100) + "%";
        const label = document.createElement("span"); label.textContent = o.name;
        const n = document.createElement("b"); n.textContent = counts[o.id] || 0;
        const btn = document.createElement("button");
        btn.textContent = mine === o.id ? "Voted" : "Vote";
        btn.onclick = () => votes.set(me.idKey, { option: o.id });
        row.append(bar, label, n, btn);
        return row;
      }));
  }

  (async () => {
    me = await quick.me();
    me.idKey = me.name.replace(/[^A-Za-z0-9_-]/g, "_").slice(0, 64) || "anon";
    document.getElementById("who").textContent = "You're " + me.name;
    options.watch(d => { optList = d; render(); });
    votes.watch(d => { voteList = d; render(); });
  })();

  const room = quick.room("lobby");
  room.on("members", m => {
    const names = [...new Set(m.map(x => x.user))];
    document.getElementById("online").textContent = names.length + " here: " + names.join(", ");
  });

  document.getElementById("add").onsubmit = async e => {
    e.preventDefault();
    const input = document.getElementById("name");
    await options.create({ name: input.value.trim() });
    input.value = "";
  };

  document.getElementById("suggest").onclick = async () => {
    const out = document.getElementById("ai");
    out.textContent = "Thinking…";
    try {
      const have = optList.map(o => o.name).join(", ") || "nothing yet";
      out.textContent = await quick.ai.ask(
        `We're picking a team lunch. Already suggested: ${have}. Suggest 3 different kinds of food, one line each, no preamble.`,
        { max_tokens: 300 });
    } catch (err) { out.textContent = "AI unavailable: " + err.message; }
  };
</script>
</body>
</html>
